apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - chatterbox.yaml
  # - ingressroute.yaml   # uncomment once DNS + TLS secret for tts.rdz.sh exist

images:
  - name: ghcr.io/prestonr83/chatterbox-tts-server
    # Pin to the 7-char upstream commit tag the pipeline prints in its run summary,
    # so a rebuild of :latest never changes what's running without you knowing.
    newTag: latest
